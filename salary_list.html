                                icon: "refresh",
                                stylingMode: "text",
                                elementAttr: { style: "color: var(--bs-body-color, #000);" },
                                onClick: function() {
                                    ReloadData();
                                }
                            }
                        });
                    }

                    // Ensure Add button is present
                    const hasAdd = toolbarItems.some(i => i.options && i.options.icon === "add");
                    if (!hasAdd) {
                        let idx = toolbarItems.findIndex(i => i.name === "columnChooserButton");
                        if (idx === -1) idx = toolbarItems.length;
                        toolbarItems.splice(idx, 0, {
                            location: "after",
                            widget: "dxButton",
                            options: {
                                icon: "add",
                                text: "",
                                stylingMode: "text",
                                elementAttr: { style: "color: var(--bs-body-color, #000);" },
                                onClick: function() {
                                    addSalaryHistoryID();
                                }
                            }
                        });
                    }

                    const defaultExportIndex = toolbarItems.findIndex(i => i.name === "exportButton");
                    if (defaultExportIndex >= 0) toolbarItems.splice(defaultExportIndex, 1);

                    const searchPanelIndex = toolbarItems.findIndex(i => i.name === "searchPanel");
                    const insertIndex = searchPanelIndex >= 0 ? searchPanelIndex : 0;

                    // 1. Checkbox: Xem lịch sử lương
                    toolbarItems.splice(insertIndex, 0, {
                        location: "before",
                        widget: "dxCheckBox",
                        options: {
                            text: "View Salary History",
                            value: dataParams.ViewAllRecord === 1,
              onValueChanged: function(chk) {
              dataParams.ViewAllRecord = chk.value ? 1 : 0;
                                ReloadData();
                            }
                        }
                    });

                    // 2. Checkbox: Nhân viên mới chưa nhập lương
                    toolbarItems.splice(insertIndex + 1, 0, {
                        location: "before",
                        widget: "dxCheckBox",
                        options: {
                            text: "New employees without salary",
                            value: dataParams.NewEmp === 1,
                            onValueChanged: function(chk) {
                                dataParams.NewEmp = chk.value ? 1 : 0;
                                ReloadData();
                            }
                        }
                    });

                    const addButtonIndex = toolbarItems.findIndex(i => i.name === "addRowButton");
                    if (addButtonIndex >= 0) {
                        toolbarItems[addButtonIndex].options.onClick = function() {
                            addSalaryHistoryID();
                        };
                    }
                    const buttonInsertIndex = addButtonIndex >= 0 ? addButtonIndex : 0;

                    // 3. Button: Xuất excel
                  toolbarItems.splice(buttonInsertIndex, 0, {
                        location: "after",
                        widget: "dxButton",
                        options: {
                            icon: "exportxlsx",
                            hint: "Export Excel",
                            onClick: function() {
      if (typeof ExcelJS !== "undefined") {
            var workbook = new ExcelJS.Workbook();
                                    var worksheet = workbook.addWorksheet("LichSuLuong");
                                    DevExpress.excelExporter.exportDataGrid({
                                        component: gridInstance,
                                        worksheet: worksheet,
                                        autoFilterEnabled: true
                                    }).then(function() {
                                        workbook.xlsx.writeBuffer().then(function(buffer) {
                                            saveAs(new Blob([buffer], { type: "application/octet-stream" }), "LichSuLuong.xlsx");
                                        });
                                    });
                                } else {
                                    DevExpress.ui.notify("ExcelJS library not found to export excel!", "error", 2000);
                                }
                            }
                        }
                    });

                    // 4. Button: Lấy file mẫu nhập thông tin lương
                    toolbarItems.splice(buttonInsertIndex + 1, 0, {
                        location: "after",
                        widget: "dxButton",
                        options: {
                            icon: "download",
                            hint: "Download Import Template",
                            onClick: async function() {
                                await gridInstance.saveEditData();
                                let exportParams = ["@EmployeeID", "-1", "@IsExport", "1", "@ViewAllRecord", dataParams.ViewAllRecord, "@NewEmp", dataParams.NewEmp];
                      await OnExport("template_salaryhistory_list", exportParams);
                            }
                        }
                    });

                    // 5. Button: Nhập vào
                    toolbarItems.splice(buttonInsertIndex + 2, 0, {
                        location: "after",
                        widget: "dxButton",
                        options: {
                            icon: "import",
                            hint: "Import Salary Data",
                            onInitialized: function(arg) {
                                var fileUploader = $("<div>").dxFileUploader({
                                    visible: false,
                                    multiple: false,
                                    dialogTrigger: arg.element,
                                    uploadMode: "useButtons",
                                    allowedFileExtensions: [".zip", ".xlsx", ".xls", ".csv", ".txt"],
                                    inputAttr: {
                                        accept: ".zip, .xlsx, .xls, .csv, .txt",
                                    },
                                    onValueChanged: async function (fuArg) {
                                        if (fuArg.value.length == 0) return;
                                        var result = false;
                                        var myDialog = DevExpress.ui.dialog.custom({
                                            title: "Confirm Import",
                                            messageHtml: "<div style=\"min-width: 15vw\">Are you sure you want to import this data file into the system?</div>",
                                            buttons: [
                                                {
                                                    text: "Yes",
                                                    onClick: function () { return true; }
                                                },
                   {
                                                    text: "No",
                                                    onClick: function () { return false; }
    }
                                            ]
                });
                             await myDialog.show().done(function (dialogResult) {
                                            result = dialogResult;
                                        });

                                        if (!result) return;

                                        async function UploadMergeFileSplit(src, fileName) {
                                            var splitImage = src.match(/.{1,5120000}/g);
                                            var totalIndex = splitImage.length;
                                            var index = 0;
                                            var tempName = uuidv4() + ".tmp";
                                            if (!fileName) fileName = tempName;
                                            var pathResult = "";

                                            while (index < totalIndex) {
                                                try {
                                                    var resData = await AjaxHPAParadiseParadiseAsync({
                                                        data: {
                                                            sendEncryption: false,
                                                            name: "MergeFileSplit",
                                                            param: [
                                                                splitImage[index],
                                                                index,
                                                                totalIndex,
                                                                tempName,
                                                                fileName,
                                                            ]
                                                        },
                                         });
                                                    index += 1;
                                                    pathResult = resData;
                                                } catch (error) {
                                       if (error.status == 200) index += 1;
                                                }
                                 }
                                            return pathResult;
                                        }

                                        fuArg.value.forEach(async (file) => {
                                            if (!file.path) {
                                                var reader = new FileReader();
                                                reader.readAsDataURL(file);
                                                reader.onload = async function () {
                                                    file.path = reader.result;
                                                    file.path = file.path.substring(file.path.indexOf(",") + 1);

                                                    showLoadingByClassOrID("#sp_SalaryHistory_List_html", "Loading...");

                                                    var a = await UploadMergeFileSplit(file.path, file.name);
                                                    a = (typeof a == "string") ? JSON.parse(a) : a;
                                                    file.path = a.data;

                                                    await AjaxHPAParadiseParadiseAsync({
                                                        data: { name: "ImportLocationFolder", param: [file.path, file.name, "", ""] },
                                                        success: function (resultData) {
                                                            var parsedData = (typeof resultData == "string") ? JSON.parse(resultData) : resultData;
                    var dataValue = parsedData.data;
              if (dataValue && dataValue.includes("Error")) {
                                                 DevExpress.ui.dialog.alert(dataValue, "Error");
                                                            } else {
                                                          DevExpress.ui.notify({
                                                                    message: "Success!",
                                                                    type: "success",
                                                                    displayTime: 2500,
                                                                    position: { my: "right bottom", at: "right bottom", offset: "-20 -20" }
                                                                });
                                                            }
                                                            HideLoadingByClassOrID("#sp_SalaryHistory_List_html");
                                                            ReloadData();
                                                        },
                                                        error: function () {
                                                            HideLoadingByClassOrID("#sp_SalaryHistory_List_html");
                                                        }
                                                    });
                                                };
                                            } else {
                                                showLoadingByClassOrID("#sp_SalaryHistory_List_html", "Loading...");
                                                var a = await UploadMergeFileSplit(file.path, file.name);
                                                a = (typeof a == "string") ? JSON.parse(a) : a;
                                                file.path = a.data;

                                                await AjaxHPAParadiseParadiseAsync({
                data: { name: "ImportLocationFolder", param: [file.path, file.name, "", ""] },
                                                    success: function () {
HideLoadingByClassOrID("#sp_SalaryHistory_List_html");
                                                        DevExpress.ui.notify({
                                                            message: "Success!",
                                                            type: "success",
                                                            displayTime: 2500,
                                                            position: { my: "right bottom", at: "right bottom", offset: "-20 -20" }
                                                        });
                                                        ReloadData();
                                                    },
                                                    error: function () {
                                                        HideLoadingByClassOrID("#sp_SalaryHistory_List_html");
                                                    }
                                                });
                                            }
                                        });
                                    }
                                });
                                arg.element.parent().append(fileUploader);
                            }
                        }
                    });
                });

                gridInstance.endUpdate();
                gridInstance.repaint();

                // ============================================================

                // 3. HÀM RELOAD DATA TỐI GIẢN
                // ============================================================
                function ReloadData(pageNumber, pageSize, keyword = null) {
                    if (keyword !== null) _currentKeyword = keyword.trim();
                    _pageCache = {};
                    _summaryCache = {};
                    gridInstance.refresh();
                }

                async function OnExport(exportName, param = []) {
                    if (window.sp_SalaryHistory_List && typeof window.sp_SalaryHistory_List.OnExport === "function") {
                        await window.sp_SalaryHistory_List.OnExport(exportName, param);
                return;
                    }
                    let fileName, filePath, exportLocationResult, exportExists = true;
                    await AjaxHPAParadiseAsync({
                        data: {
                            name: "sp_getTaskExport",
                            param: ["@ExportName", exportName]
                        },
                        success: async function (resultData) {
                            let jsonData = typeof resultData === "string" ? JSON.parse(resultData) : resultData;
                            if(jsonData.data[0] && jsonData.data[0][0]) {
                                fileName = jsonData.data[0][0].TemplateFileName;
                                exportName = jsonData.data[0][0].ExportName;
                            } else {
                                exportExists = false;
                            }
                        }
                    });
                    if(!exportExists) {
                        console.error("Cannot find export:", exportName);
                        return;
                    }
                    await AjaxHPAParadiseParadiseAsync({
                        data: {
                            name: "ExportLocationFolder",
                            param: ["", exportName, fileName, ...param]
                        },
                        success: function (resultData) {
                            let jsonData = typeof resultData === "string" ? JSON.parse(resultData) : resultData;
                            if(jsonData) {
                                exportLocationResult = jsonData;
                            }
                        }
                    });
                    if(window.ParadiseOption && window.ParadiseOption.AppInfoPackageName == "com.vietinsoft.onshiftparadisehr") {
             await AjaxHPAParadiseParadiseAsync({
                            data: {
                                name: "MobileOpenFileAsync",
                                param: [exportLocationResult.FilePath, exportLocationResult.FileName]
            }
                        });
                    } else {
                        exportLocationResult = typeof exportLocationResult.data === "string" ? JSON.parse(exportLocationResult.data) : exportLocationResult.data;
                        await AjaxHPAParadiseParadiseAsync({
                            data: {
                                name: "ReadPathFileToByte",
                                param: [exportLocationResult.FilePath]
                            },
                            success: function (result) {
                                let resultData = typeof result === "string" ? JSON.parse(result) : result;
                                saveAsFile(exportLocationResult.FileName, resultData.data);
                            }
                        });
                    }
                }

                
                setTimeout(updateGridHeight, 100);
                setTimeout(updateGridHeight, 500);

                const _resizeHandler = function() { updateGridHeight(); };
                $(window).on("resize.gridSalaryHistory", _resizeHandler);

                const _gridWrap = document.getElementById("sp_SalaryHistory_List_html");
                if (_gridWrap && typeof ResizeObserver !== "undefined") {
                    const _ro = new ResizeObserver(function() {
                        updateGridHeight();
                    });
                    _ro.observe(_gridWrap);
                }

                ReloadData()
            })();
        </script>
